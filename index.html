<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171D1F" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#C8C5BD" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Çözgü" />
    <meta name="apple-mobile-web-app-title" content="Çözgü" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Türk dili ve edebiyatı araştırmaları için Unicode transkripsiyon aracı." />
    <link rel="icon" href="/icons/cozgu-192.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/cozgu-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/cozgu-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/cozgu-180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Çözgü</title>
    <script>
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('kripsiyon-preferences-v2') || '{}')
          const preference = stored.themePreference || stored.theme || 'system'
          const resolved = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
          document.documentElement.dataset.theme = resolved
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', resolved === 'dark' ? '#171D1F' : '#C8C5BD')
        } catch {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#171D1F')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
